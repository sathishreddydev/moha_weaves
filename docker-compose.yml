services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: moha_weaves_postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - moha_weaves_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis Cache ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: moha_weaves_redis
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]
    volumes:
      - redis_data:/data
    networks:
      - moha_weaves_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Admin Backend (Express API + React admin panel) ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moha_weaves_app
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - "5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moha_weaves_network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── Next.js Customer Frontend ────────────────────────────────────────────────
  nextjs:
    build:
      context: ../moha_weaves_nextjs
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_IMAGE_URL: ${NEXT_PUBLIC_IMAGE_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
    env_file:
      - ../moha_weaves_nextjs/.env.prod
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    container_name: moha_weaves_frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - moha_weaves_network

  # ── Nginx Reverse Proxy (SSL termination + routing) ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: moha_weaves_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
      nextjs:
        condition: service_started
    networks:
      - moha_weaves_network

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  moha_weaves_network:
    driver: bridge
