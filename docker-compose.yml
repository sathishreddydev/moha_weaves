version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: moha_weaves_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moha_weaves
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mohaweaves@123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - moha_weaves_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: moha_weaves_redis
    restart: unless-stopped
    command: redis-server --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - moha_weaves_network

  # Application (monolithic - contains both frontend and backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moha_weaves_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:Mohaweaves%40123@postgres:5432/moha_weaves
      REDIS_URL: redis://:redis123@redis:6379
      SESSION_SECRET: mohaweaves_secret_key
      CLOUDINARY_CLOUD_NAME: dtnj9soo7
      CLOUDINARY_API_KEY: 162729439253832
      CLOUDINARY_API_SECRET: -J68bCqXcCft9WS3338T7Cyw8zs
      RAZORPAY_KEY_ID: rzp_test_UxXBzl98ySixq7
      RAZORPAY_KEY_SECRET: n78QX7ZaxGndqCdRryofDbNU
      RAZORPAY_WEBHOOK_SECRET: Ksr@0337
      EMAIL_ENABLED: true
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: false
      SMTP_USER: sathishreddy.k0337@gmail.com
      SMTP_PASS: your-gmail-app-password
      EMAIL_FROM_NAME: Mohaweaves
      EMAIL_FROM_EMAIL: sathishreddy.k0337@gmail.com
      DELHIVERY_CLIENT_ID: c4a98f-MOHA-do-B2C
      DELHIVERY_API_TOKEN: ea2a8b677597d3cf97b5d3522930d540c1240795
      DELHIVERY_PICKUP_WAREHOUSE: c4a98f-MOHA-do-B2C
      DELHIVERY_TEST_URL: https://staging-express.delhivery.com
      DELHIVERY_PRODUCTION_URL: https://track.delhivery.com
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - moha_weaves_network

  # Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: moha_weaves_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - moha_weaves_network

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  moha_weaves_network:
    driver: bridge
