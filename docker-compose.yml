services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: moha_weaves_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOTE: Do NOT mount migrations here — Drizzle migrations are run via
      # "npm run db:migrate" after the app starts, not by Postgres initdb.
    # Postgres is NOT exposed to the host — only reachable within Docker network
    networks:
      - moha_weaves_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis Cache ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: moha_weaves_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # Redis is NOT exposed to the host — only reachable within Docker network
    networks:
      - moha_weaves_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Application (monolithic — frontend + backend) ────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moha_weaves_app
    restart: unless-stopped
    # All secrets come ONLY from .env.prod — no inline environment: block so
    # there is a single source of truth and no accidental override.
    env_file:
      - .env.prod
    # Not exposed to host — nginx proxies traffic internally
    expose:
      - "5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moha_weaves_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  nextjs:
    build:
      context: ../moha_weaves_nextjs
      dockerfile: Dockerfile
      # Build args are passed from the env file at build time via --build-arg.
      # Secrets are NOT baked as ARGs — only public NEXT_PUBLIC_* values.
      # NEXTAUTH_URL is runtime-only — injected via env_file, not needed at build.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_IMAGE_URL: ${NEXT_PUBLIC_IMAGE_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
    env_file:
      - .env.prod
    container_name: moha_weaves_frontend
    restart: unless-stopped
    # Not exposed to host — nginx proxies traffic internally
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - moha_weaves_network

  # ── Nginx Reverse Proxy (SSL termination + routing) ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: moha_weaves_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
      nextjs:
        condition: service_started
    networks:
      - moha_weaves_network

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  moha_weaves_network:
    driver: bridge
