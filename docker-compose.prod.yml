version: '3.8'

services:
  # Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moha_weaves_app
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./attached_assets:/app/attached_assets
    depends_on:
      - postgres
      - redis
    networks:
      - moha_weaves_network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: moha_weaves_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moha_weaves
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mohaweaves@123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    networks:
      - moha_weaves_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: moha_weaves_redis
    restart: unless-stopped
    command: redis-server --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - moha_weaves_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: moha_weaves_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./uploads:/var/www/uploads
      - ./attached_assets:/var/www/attached_assets
    depends_on:
      - app
    networks:
      - moha_weaves_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  moha_weaves_network:
    driver: bridge
