name: Deploy to Beta/Staging

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Type "deploy" to confirm beta deployment'
        required: true
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Confirm Deployment
        run: |
          if [ "${{ github.event.inputs.confirm_deployment }}" != "deploy" ]; then
            echo "❌ Deployment not confirmed. Type 'deploy' to proceed."
            exit 1
          fi
          echo "✅ Beta deployment confirmed. Proceeding..."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        # DATABASE_URL comes directly from secrets — NOT from the template env file.
        run: npm run db:migrate
        env:
          NODE_ENV: beta
          DATABASE_URL: ${{ secrets.BETA_DATABASE_URL }}

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run tests
        run: npm test --if-present

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BETA_AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.BETA_AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.BETA_AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy to Azure Beta
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mohaweaves-beta'
          slot-name: 'Production'
          package: .
