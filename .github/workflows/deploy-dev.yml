name: Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Load environment variables
        run: |
          echo "Loading development environment variables..."
          cp .env.development .env
          
      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run tests
        run: npm test --if-present

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEV_AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.DEV_AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.DEV_AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy to Azure Dev
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mohaweaves-dev'
          slot-name: 'Production'
          package: .
